<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V0E6QSYD2C"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-V0E6QSYD2C');
    </script>

    <!-- Primary Meta Tags -->
    <title>{{full_title}} - Prog Lang Compare</title>
    <meta name="title" content="{{full_title}} - Prog Lang Compare">
    <meta name="description" content="{{description}}">
    <meta name="keywords" content="{{language}}, {{concept_title}}, programming, code examples, syntax, {{category}}">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{page_url}}">
    <meta property="og:title" content="{{full_title}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:image" content="{{BASE_URL}}/social-preview.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="{{page_url}}">
    <meta property="twitter:title" content="{{full_title}}">
    <meta property="twitter:description" content="{{description}}">
    <meta property="twitter:image" content="{{BASE_URL}}/social-preview.png">

    <!-- Canonical URL -->
    <link rel="canonical" href="{{page_url}}">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">

    <!-- Inline Critical CSS -->
    <link rel="stylesheet" href="../../styles.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 900px;
            margin: 0 auto;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--bg-primary);
            padding: 30px;
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
        }

        nav.breadcrumb {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        nav.breadcrumb a {
            color: var(--primary);
            text-decoration: none;
        }

        nav.breadcrumb a:hover {
            text-decoration: underline;
        }

        nav.breadcrumb span {
            color: var(--text-secondary);
            margin: 0 5px;
        }

        h1 {
            color: var(--text-primary);
            margin-bottom: 10px;
            font-size: 28px;
        }

        .meta {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 30px;
            padding: 10px;
            background-color: var(--bg-tertiary);
            border-left: 4px solid var(--primary);
        }

        .concept-article-content {
            margin-top: 20px;
        }

        .concept-article-content p {
            margin-bottom: 15px;
        }

        .concept-article-content pre {
            background-color: var(--code-bg);
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 15px 0;
            border: 1px solid var(--code-border);
        }

        .concept-article-content code {
            background-color: var(--code-bg);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
        }

        .concept-article-content pre code {
            background-color: transparent;
            padding: 0;
        }

        .back-link {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .back-link a {
            color: var(--primary);
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
        }
    </style>

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "TechArticle",
        "headline": "{{full_title}}",
        "description": "{{description}}",
        "keywords": "{{language}}, {{concept_title}}, programming",
        "url": "{{page_url}}",
        "datePublished": "2023-06-09",
        "dateModified": "{{date_modified}}",
        "author": {
            "@type": "Organization",
            "name": "Prog Lang Compare"
        },
        "publisher": {
            "@type": "Organization",
            "name": "Prog Lang Compare",
            "url": "{{BASE_URL}}"
        },
        "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": "{{page_url}}"
        }
    }
    </script>
</head>

<body>
    <!-- Dark Mode Toggle -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <svg id="moonIcon" style="display: none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
    </button>

    <div class="container">
        <!-- Breadcrumb Navigation -->
        <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="../../index.html">Home</a>
            <span>›</span>
            <a href="../{{language_slug}}.html">{{language_display}}</a>
            <span>›</span>
            <span>{{concept_title}}</span>
        </nav>

        <!-- Main Content -->
        <main>
            <div class="header-controls"
                style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; margin-bottom: 24px;">
                <h1 style="margin-bottom: 0;">{{full_title}}</h1>
                <div class="github-cta">
                    <span>Find this useful? Support us:</span>
                    {{github_button}}
                </div>
            </div>

            <div class="meta">
                <strong>Category:</strong> {{category}} |
                <strong>Language:</strong> {{language_display}}
            </div>

            <article class="concept-article-content">
                {{content_html}}
            </article>

            {{related_concepts}}

            <div class="back-link">
                <a href="../../index.html">← Back to Full Comparison Table</a>
            </div>
        </main>

        <footer>
            <p>Content generated using AI | <a href="https://github.com/srix/prog-lang-compare" target="_blank"
                    rel="noopener noreferrer">View on GitHub</a></p>
        </footer>
    </div>

    <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.2.0/highlight.min.js"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.2.0/languages/haskell.min.js"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.2.0/languages/dart.min.js"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.2.0/languages/julia.min.js"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.2.0/languages/kotlin.min.js"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.2.0/languages/scala.min.js"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.2.0/languages/groovy.min.js"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.2.0/languages/matlab.min.js"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.2.0/languages/vbnet.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            document.querySelectorAll('pre code').forEach((el) => {
                hljs.highlightElement(el);
            });
        });
    </script>
    <script src="../../theme.js"></script>
</body>

</html>
