<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        // Redirect logic
        var newHost = "https://programming-languages.com";

        // Preserve current path and query
        var currentPath = window.location.pathname;
        var currentQuery = window.location.search;

        // Handle GitHub Pages project path (remove /prog-lang-compare/ if present)
        currentPath = currentPath.replace(/^\/prog-lang-compare\//, "/");

        // Construct new URL
        var newUrl = newHost + currentPath + currentQuery;

        // Perform redirect
        window.location.replace(newUrl);
    </script>
    <meta http-equiv="refresh" content="0;url=https://programming-languages.com/">
    <link rel="canonical" href="https://programming-languages.com/">
</head>

<body>
    <p>Redirecting to <a href="https://programming-languages.com/">https://programming-languages.com/</a>...</p>
</body>

</html>
